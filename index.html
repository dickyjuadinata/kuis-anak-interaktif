<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Sains Anak</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
    }
    h1 { color: #2c3e50; font-size: 24px; text-align: center; }
    .question-box {
      background: #e1f5fe;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
      color: #0277bd;
    }
    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      border: 2px solid #b0bec5;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      margin-bottom: 15px;
    }
    button {
      width: 100%;
      background-color: #4caf50;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 10px;
    }
    button:disabled { background-color: #9e9e9e; cursor: not-allowed; }
    button.btn-next { background-color: #0288d1; }
    .result-box {
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }
    .correct { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .incorrect { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
  </style>
</head>
<body>

<div class="card">
  <h1>Kuis Sains Anak 🌟</h1>
  
  <div class="question-box" id="soalText">Memuat soal dari Google Sheets...</div>

  <textarea id="jawabanAnak" placeholder="Tulis jawabanmu di sini..."></textarea>
  
  <button id="btnKirim" onclick="periksaJawaban()" disabled>Kirim Jawaban</button>
  <button id="btnLanjut" class="btn-next" onclick="tampilkanSoalAcak()" style="display: none;">Soal Berikutnya ➡️</button>

  <div id="resultBox" class="result-box"></div>
</div>

<script>
  // ID GOOGLE SHEETS ANDA
  const SPREADSHEET_ID = "1OEc5Hin9AATboY0Hl9RnYd7E8QemA89-QchTzDW0Jp4"; 
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

  let bankSoalUtama = []; 
  let antreanSoal = [];   
  let soalSaatIni = null;

  // Algoritma Pengacak Urutan (Fisher-Yates Shuffle)
  function acakArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Memuat seluruh bank soal dari Google Sheets
  async function muatBankSoal() {
    try {
      const response = await fetch(SHEET_URL);
      const text = await response.text();
      
      // Ambil respon JSON murni
      const jsonString = text.substring(47, text.length - 2);
      const data = JSON.parse(jsonString);
      const rows = data.table.rows;
      
      bankSoalUtama = [];

      // Loop semua baris (mulai dari indeks 1 untuk lewati header)
      for (let i = 1; i < rows.length; i++) {
        const c = rows[i].c;
        if (!c) continue;

        // Ambil nilai kolom A, B, C secara aman
        const teksSoal = (c[0] && c[0].v !== null) ? String(c[0].v).trim() : "";
        const teksKunci = (c[1] && c[1].v !== null) ? String(c[1].v).trim() : "";
        const teksJawaban = (c[2] && c[2].v !== null) ? String(c[2].v).trim() : "";

        // Hanya masukkan jika kolom Soal tidak kosong
        if (teksSoal !== "") {
          bankSoalUtama.push({
            soal: teksSoal,
            kataKunci: teksKunci ? teksKunci.split(",").map(k => k.trim().toLowerCase()) : [],
            kunciJawaban: teksJawaban
          });
        }
      }

      if (bankSoalUtama.length > 0) {
        document.getElementById("btnKirim").disabled = false;
        // Acak seluruh soal dari IPAS, B. Inggris, & Matematika
        antreanSoal = acakArray(bankSoalUtama);
        tampilkanSoalAcak();
      } else {
        document.getElementById("soalText").innerText = "Bank soal di Google Sheets kosong atau format tidak sesuai.";
      }
    } catch (error) {
      document.getElementById("soalText").innerText = "Gagal memuat bank soal dari Google Sheets.";
      console.error(error);
    }
  }

  // Menampilkan pertanyaan dari antrean tanpa berulang
  function tampilkanSoalAcak() {
    if (bankSoalUtama.length === 0) return;

    // Jika antrean habis, acak ulang seluruh bank soal
    if (antreanSoal.length === 0) {
      antreanSoal = acakArray(bankSoalUtama);
    }

    // Ambil 1 soal dari antrean
    soalSaatIni = antreanSoal.pop();

    document.getElementById("soalText").innerText = "Soal: " + soalSaatIni.soal;
    document.getElementById("jawabanAnak").value = "";
    document.getElementById("resultBox").style.display = "none";
    document.getElementById("btnKirim").style.display = "block";
    document.getElementById("btnLanjut").style.display = "none";
  }

  // Penilaian berbasis kata kunci secara lokal
  function periksaJawaban() {
    const inputJawaban = document.getElementById("jawabanAnak").value.trim().toLowerCase();
    const resultBox = document.getElementById("resultBox");

    if (!inputJawaban) {
      alert("Tulis jawabanmu terlebih dahulu ya!");
      return;
    }

    // Cek kecocokan kata kunci
    const isCorrect = soalSaatIni.kataKunci.some(keyword => inputJawaban.includes(keyword));

    resultBox.style.display = "block";
    if (isCorrect) {
      resultBox.className = "result-box correct";
      resultBox.innerHTML = `<strong>Hebat! Jawabanmu Benar! 🎉</strong><br><br>Pintar sekali, jawabanmu tepat!`;
    } else {
      resultBox.className = "result-box incorrect";
      resultBox.innerHTML = `<strong>Hampir Benar! 😊</strong><br><br>Tetap semangat belajar ya!<br><br><em>Penjabaran / Kunci Jawaban:</em><br>${soalSaatIni.kunciJawaban}`;
    }

    document.getElementById("btnKirim").style.display = "none";
    document.getElementById("btnLanjut").style.display = "block";
  }

  // Jalankan saat halaman dibuka
  muatBankSoal();
</script>

</body>
</html>
