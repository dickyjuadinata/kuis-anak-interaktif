<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Pintar Anak</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
    }
    h1 { color: #2c3e50; font-size: 24px; text-align: center; }
    .question-box {
      background: #e1f5fe;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
      color: #0277bd;
    }
    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      border: 2px solid #b0bec5;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      margin-bottom: 15px;
    }
    button {
      width: 100%;
      background-color: #4caf50;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled { background-color: #ccc; }
    .result-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }
    .correct { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .incorrect { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
  </style>
</head>
<body>

<div class="card">
  <h1>Kuis Sains Anak 🌟</h1>
  
  <div class="question-box" id="soalText">
    Soal: Mengapa tumbuhan membutuhkan sinar matahari?
  </div>

  <textarea id="jawabanAnak" placeholder="Tulis jawabanmu di sini..."></textarea>
  <button id="btnKirim" onclick="submitJawaban()">Kirim Jawaban</button>

  <div id="resultBox" class="result-box"></div>
</div>

<script>
  // Pastikan URL bersih dari spasi atau karakter tersembunyi
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwKB0EA6GJMgC31v9zPkFbnfrKPXoAHwR2xzIC7hXRlrtrKHQMP6pMY3Ego1Il36ObkZA/exec";

  const dataSoal = {
    soal: "Mengapa tumbuhan membutuhkan sinar matahari?",
    kunciJawaban: "Untuk proses fotosintesis / membuat makanan sendiri."
  };

  async function submitJawaban() {
    const jawabanAnak = document.getElementById("jawabanAnak").value.trim();
    const resultBox = document.getElementById("resultBox");
    const btnKirim = document.getElementById("btnKirim");

    if (!jawabanAnak) {
      alert("Tulis jawabanmu terlebih dahulu ya!");
      return;
    }

    btnKirim.disabled = true;
    btnKirim.innerText = "Guru AI sedang memeriksa...";
    resultBox.style.display = "none";

    try {
      const payloadData = JSON.stringify({
        soal: dataSoal.soal,
        kunciJawaban: dataSoal.kunciJawaban,
        jawabanAnak: jawabanAnak
      });

      // Menggunakan Content-Type text/plain murni untuk menghindari masalah pemicu CORS Safari
      const response = await fetch(GAS_URL.trim(), {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: payloadData
      });

      const data = await response.json();

      resultBox.style.display = "block";
      if (data.isCorrect) {
        resultBox.className = "result-box correct";
        resultBox.innerHTML = `<strong>Hebat! Jawabanmu Benar!</strong><br><br>${data.feedback}`;
      } else {
        resultBox.className = "result-box incorrect";
        resultBox.innerHTML = `<strong>Hampir Benar!</strong><br><br>${data.feedback}<br><br><em>Kunci Jawaban: ${data.correctAnswer}</em>`;
      }
    } catch (error) {
      alert("Terjadi kesalahan koneksi: " + error.message);
      console.error("Detail Error Frontend:", error);
    } finally {
      btnKirim.disabled = false;
      btnKirim.innerText = "Kirim Jawaban";
    }
  }
</script>

</body>
</html>
