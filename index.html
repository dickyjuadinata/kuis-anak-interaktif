<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Pintar Kelas 4 SD</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
    }
    h1 { color: #2c3e50; font-size: 24px; text-align: center; margin-top: 0; }
    
    .score-bar {
      display: flex;
      justify-content: space-between;
      background: #f1f8e9;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      font-weight: bold;
      color: #33691e;
    }

    .question-box {
      background: #e1f5fe;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
      color: #0277bd;
      line-height: 1.5;
    }
    
    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #b0bec5;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      margin-bottom: 15px;
    }
    textarea { height: 80px; }

    button {
      width: 100%;
      background-color: #4caf50;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 10px;
    }
    button:disabled { background-color: #9e9e9e; cursor: not-allowed; }
    button.btn-next { background-color: #0288d1; }
    button.btn-restart { background-color: #ff9800; }

    .result-box {
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
      display: none;
      line-height: 1.5;
    }
    .correct { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .incorrect { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
    
    #quizScreen, #finishScreen { display: none; }
  </style>
</head>
<body>

<div class="card">
  <h1>Kuis Pintar SD Kelas 4 🌟</h1>

  <!-- LAYAR 1: MASUKKAN NAMA -->
  <div id="startScreen">
    <p style="text-align: center; color: #555;">Selamat datang! Silakan masukkan namamu sebelum mulai kuis:</p>
    <input type="text" id="namaAnak" placeholder="Ketik nama lengkapmu di sini..." autocomplete="off">
    <button id="btnMulai" onclick="mulaiKuis()" disabled>Mulai Kuis 🚀</button>
  </div>

  <!-- LAYAR 2: TAMPILAN SOAL & PENILAIAN -->
  <div id="quizScreen">
    <div class="score-bar">
      <span>👤 <span id="dispNama">-</span></span>
      <span>Soal: <span id="dispProgres">0/0</span></span>
      <span>Nilai: <span id="dispNilai">0</span></span>
    </div>

    <div class="question-box" id="soalText">Memuat soal...</div>

    <textarea id="jawabanAnak" placeholder="Tulis jawabanmu di sini..."></textarea>

    <button id="btnKirim" onclick="periksaJawaban()">Kirim Jawaban</button>
    <button id="btnLanjut" class="btn-next" onclick="tampilkanSoalBerikutnya()" style="display: none;">Soal Berikutnya ➡️</button>

    <div id="resultBox" class="result-box"></div>
  </div>

  <!-- LAYAR 3: HASIL AKHIR -->
  <div id="finishScreen" style="text-align: center;">
    <h2>Selesai! 🎉</h2>
    <p>Hebat sekali, <strong id="finishNama"></strong>!</p>
    <p style="font-size: 18px;">Nilai Akhirmu:</p>
    <h1 style="font-size: 48px; color: #2e7d32; margin: 10px 0;" id="finishNilai">0</h1>
    <p id="finishDetail" style="color: #555;"></p>
    <button class="btn-restart" onclick="ulangKuis()">Main Lagi 🔄</button>
  </div>
</div>

<script>
  const SPREADSHEET_ID = "1OEc5Hin9AATboY0Hl9RnYd7E8QemA89-QchTzDW0Jp4"; 
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

  let bankSoalUtama = [];
  let antreanSoal = [];
  let soalSaatIni = null;

  let namaSiswa = "";
  let totalSoal = 0;
  let jumlahBenar = 0;
  let jumlahSalah = 0;
  let soalSelesaiCount = 0;

  // Fungsi pengacak urutan (Fisher-Yates Shuffle)
  function acakArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Fungsi konversi aman sel Google Sheets ke String
  function ambilTeksSel(cell) {
    if (!cell) return "";
    if (cell.f !== undefined && cell.f !== null) return String(cell.f).trim();
    if (cell.v !== undefined && cell.v !== null) return String(cell.v).trim();
    return "";
  }

  // Event listener input nama
  document.getElementById("namaAnak").addEventListener("input", function() {
    const nama = this.value.trim();
    document.getElementById("btnMulai").disabled = nama.length === 0 || bankSoalUtama.length === 0;
  });

  // Memuat bank soal secara menyeluruh dari Google Sheets
  async function muatBankSoal() {
    try {
      const response = await fetch(SHEET_URL);
      const text = await response.text();
      const jsonString = text.substring(47, text.length - 2);
      const data = JSON.parse(jsonString);
      const rows = data.table.rows;

      bankSoalUtama = [];

      // Membaca dari indeks 0 karena Google Sheets gViz API secara otomatis
      // menjadikan Baris 1 sebagai nama kolom (header)
      for (let i = 0; i < rows.length; i++) {
        const c = rows[i].c;
        if (!c) continue;

        const valA = ambilTeksSel(c[0]);
        const valB = ambilTeksSel(c[1]);
        const valC = ambilTeksSel(c[2]);

        // Abaikan jika baris tersebut memuat nama header
        if (valA.toLowerCase() === "a (soal)" || valA.toLowerCase() === "soal") {
          continue;
        }

        // Simpan hanya jika kolom soal berisi teks
        if (valA !== "") {
          bankSoalUtama.push({
            soal: valA,
            kataKunci: valB ? valB.split(",").map(k => k.trim().toLowerCase()) : [],
            kunciJawaban: valC
          });
        }
      }

      console.log("Total Soal Berhasil Dimuat:", bankSoalUtama.length);

      if (bankSoalUtama.length > 0) {
        const inputNama = document.getElementById("namaAnak").value.trim();
        if (inputNama) document.getElementById("btnMulai").disabled = false;
      } else {
        alert("Bank soal di Google Sheets kosong atau format sel salah.");
      }
    } catch (error) {
      console.error("Eror saat memuat soal:", error);
      alert("Gagal memuat bank soal dari Google Sheets.");
    }
  }

  // Mulai Kuis
  function mulaiKuis() {
    namaSiswa = document.getElementById("namaAnak").value.trim();
    if (!namaSiswa) return;

    totalSoal = bankSoalUtama.length;
    jumlahBenar = 0;
    jumlahSalah = 0;
    soalSelesaiCount = 0;

    document.getElementById("dispNama").innerText = namaSiswa;
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("quizScreen").style.display = "block";

    // Acak seluruh kumpulan soal IPAS, B. Inggris, & Matematika secara merata
    antreanSoal = acakArray(bankSoalUtama);
    tampilkanSoalBerikutnya();
  }

  // Tampilkan Soal Berikutnya dari Antrean
  function tampilkanSoalBerikutnya() {
    if (antreanSoal.length === 0) {
      tampilkanLayarSelesai();
      return;
    }

    soalSaatIni = antreanSoal.pop();
    soalSelesaiCount++;

    updateStatsBar();

    document.getElementById("soalText").innerText = "Soal " + soalSelesaiCount + ": " + soalSaatIni.soal;
    document.getElementById("jawabanAnak").value = "";
    document.getElementById("resultBox").style.display = "none";
    document.getElementById("btnKirim").style.display = "block";
    document.getElementById("btnLanjut").style.display = "none";
  }

  // Pemeriksaan Jawaban
  function periksaJawaban() {
    const inputJawaban = document.getElementById("jawabanAnak").value.trim().toLowerCase();
    const resultBox = document.getElementById("resultBox");

    if (!inputJawaban) {
      alert("Tulis jawabanmu terlebih dahulu ya!");
      return;
    }

    const isCorrect = soalSaatIni.kataKunci.some(keyword => keyword !== "" && inputJawaban.includes(keyword));

    if (isCorrect) {
      jumlahBenar++;
    } else {
      jumlahSalah++;
    }

    updateStatsBar();

    resultBox.style.display = "block";
    if (isCorrect) {
      resultBox.className = "result-box correct";
      resultBox.innerHTML = `<strong>Hebat! Jawabanmu Benar! 🎉</strong><br><br>Pintar sekali, jawabanmu tepat!`;
    } else {
      resultBox.className = "result-box incorrect";
      resultBox.innerHTML = `<strong>Hampir Benar! 😊</strong><br><br>Tetap semangat!<br><br><em>Kunci Jawaban:</em><br>${soalSaatIni.kunciJawaban}`;
    }

    document.getElementById("btnKirim").style.display = "none";
    document.getElementById("btnLanjut").style.display = "block";
  }

  // Update Bar Skor
  function updateStatsBar() {
    const nilai = totalSoal > 0 ? Math.round((jumlahBenar / totalSoal) * 100) : 0;
    document.getElementById("dispProgres").innerText = `${soalSelesaiCount}/${totalSoal}`;
    document.getElementById("dispNilai").innerText = nilai;
  }

  // Layar Hasil Akhir
  function tampilkanLayarSelesai() {
    const nilaiAkhir = Math.round((jumlahBenar / totalSoal) * 100);
    document.getElementById("quizScreen").style.display = "none";
    document.getElementById("finishScreen").style.display = "block";

    document.getElementById("finishNama").innerText = namaSiswa;
    document.getElementById("finishNilai").innerText = nilaiAkhir;
    document.getElementById("finishDetail").innerText = `Kamu menjawab ${jumlahBenar} benar dan ${jumlahSalah} salah dari total ${totalSoal} soal.`;
  }

  // Restart Kuis
  function ulangKuis() {
    document.getElementById("finishScreen").style.display = "none";
    document.getElementById("startScreen").style.display = "block";
    document.getElementById("namaAnak").value = "";
    document.getElementById("btnMulai").disabled = true;
    muatBankSoal();
  }

  // Jalankan pemuatan soal saat halaman pertama kali dibuka
  muatBankSoal();
</script>

</body>
</html>
