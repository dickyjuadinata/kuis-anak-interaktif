<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Sains Anak</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
    }
    h1 { color: #2c3e50; font-size: 24px; text-align: center; }
    .question-box {
      background: #e1f5fe;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
      color: #0277bd;
    }
    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      border: 2px solid #b0bec5;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      margin-bottom: 15px;
    }
    button {
      width: 100%;
      background-color: #4caf50;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 10px;
    }
    button:disabled { background-color: #9e9e9e; cursor: not-allowed; }
    button.btn-next { background-color: #0288d1; }
    .result-box {
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }
    .correct { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .incorrect { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
  </style>
</head>
<body>

<div class="card">
  <h1>Kuis Sains Anak 🌟</h1>
  
  <div class="question-box" id="soalText">Memuat soal dari Google Sheets...</div>

  <textarea id="jawabanAnak" placeholder="Tulis jawabanmu di sini..."></textarea>
  
  <button id="btnKirim" onclick="periksaJawaban()" disabled>Kirim Jawaban</button>
  <button id="btnLanjut" class="btn-next" onclick="tampilkanSoalAcak()" style="display: none;">Soal Berikutnya ➡️</button>

  <div id="resultBox" class="result-box"></div>
</div>

<script>
  // MASUKKAN ID GOOGLE SHEETS ANDA DI SINI
  const SPREADSHEET_ID = "1OEc5Hin9AATboY0Hl9RnYd7E8QemA89-QchTzDW0Jp4"; 
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

  let bankSoal = [];
  let soalSaatIni = null;

  // Memuat bank soal dari Google Sheets
  async function muatBankSoal() {
    try {
      const response = await fetch(SHEET_URL);
      const text = await response.text();
      
      // Mengambil JSON murni dari respon GViz API
      const jsonString = text.substring(47, text.length - 2);
      const data = JSON.parse(jsonString);
      
      const rows = data.table.rows;
      
      // .slice(1) digunakan untuk melewati baris pertama (header)
      bankSoal = rows.slice(1).map(row => {
        const c = row.c;
        return {
          soal: c && c[0] && c[0].v ? c[0].v : "",
          kataKunci: c && c[1] && c[1].v ? c[1].v.toString().split(",").map(k => k.trim().toLowerCase()) : [],
          kunciJawaban: c && c[2] && c[2].v ? c[2].v : ""
        };
      }).filter(item => item.soal !== "");

      if (bankSoal.length > 0) {
        document.getElementById("btnKirim").disabled = false;
        tampilkanSoalAcak();
      } else {
        document.getElementById("soalText").innerText = "Bank soal di Google Sheets masih kosong.";
      }
    } catch (error) {
      document.getElementById("soalText").innerText = "Gagal memuat bank soal dari Google Sheets.";
      console.error(error);
    }
  }

  // Menampilkan pertanyaan acak dari bank soal
  function tampilkanSoalAcak() {
    if (bankSoal.length === 0) return;

    const randomIndex = Math.floor(Math.random() * bankSoal.length);
    soalSaatIni = bankSoal[randomIndex];

    document.getElementById("soalText").innerText = "Soal: " + soalSaatIni.soal;
    document.getElementById("jawabanAnak").value = "";
    document.getElementById("resultBox").style.display = "none";
    document.getElementById("btnKirim").style.display = "block";
    document.getElementById("btnLanjut").style.display = "none";
  }

  function periksaJawaban() {
  const inputJawaban = document.getElementById("jawabanAnak").value.trim().toLowerCase();
  const resultBox = document.getElementById("resultBox");

  if (!inputJawaban) {
    alert("Tulis jawaban dan cara pengerjaannya terlebih dahulu ya!");
    return;
  }

  // Menghitung berapa banyak kata kunci/angka kunci yang ditemukan pada jawaban anak
  const keywordMatches = soalSaatIni.kataKunci.filter(keyword => inputJawaban.includes(keyword));
  const matchRatio = keywordMatches.length / soalSaatIni.kataKunci.length;

  resultBox.style.display = "block";

  // Jika semua kata kunci (langkah + hasil akhir) ditemukan
  if (matchRatio === 1) {
    resultBox.className = "result-box correct";
    resultBox.innerHTML = `<strong>Luar Biasa! Jawaban & Langkahmu Sangat Lengkap! 🎉</strong><br><br>Pintar sekali, jalannya sudah tepat!`;
  } 
  // Jika hanya sebagian kata kunci ditemukan (misal: hanya jawab angka tanpa cara)
  else if (matchRatio > 0) {
    resultBox.className = "result-box correct";
    resultBox.innerHTML = `<strong>Hampir Sempurna! 👍</strong><br><br>Jawabanmu sudah mendekati benar, tapi jangan lupa tuliskan jalannya secara lengkap ya!<br><br><em>Penjabaran Lengkap:</em><br>${soalSaatIni.kunciJawaban}`;
  } 
  // Jika tidak ada kata kunci yang cocok
  else {
    resultBox.className = "result-box incorrect";
    resultBox.innerHTML = `<strong>Yuk, Coba Lagi! 😊</strong><br><br>Perhatikan langkah pengerjaannya di bawah ini ya:<br><br><em>Penjabaran Lengkap:</em><br>${soalSaatIni.kunciJawaban}`;
  }

  document.getElementById("btnKirim").style.display = "none";
  document.getElementById("btnLanjut").style.display = "block";
}

  // Jalankan saat halaman dibuka
  muatBankSoal();
</script>

</body>
</html>
